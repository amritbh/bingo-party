<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 290" width="100%" height="100%" class="dashain-ping-svg">
  <defs>
    <!-- Gradients & Glows -->
    <linearGradient id="goldBamboo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>

    <linearGradient id="ropeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E1" />
      <stop offset="50%" stop-color="#FFCC80" />
      <stop offset="100%" stop-color="#BCAAA4" />
    </linearGradient>

    <linearGradient id="dauraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EDE7D9" />
    </linearGradient>

    <linearGradient id="ishtakotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A0E17" />
      <stop offset="50%" stop-color="#2D080E" />
      <stop offset="100%" stop-color="#1A0407" />
    </linearGradient>

    <linearGradient id="kite1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E53935" />
      <stop offset="50%" stop-color="#FB8C00" />
      <stop offset="100%" stop-color="#FDD835" />
    </linearGradient>

    <linearGradient id="kite2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#43A047" />
      <stop offset="50%" stop-color="#00ACC1" />
      <stop offset="100%" stop-color="#1E88E5" />
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FFB300" flood-opacity="0.5" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#FFD54F" flood-opacity="0.4" />
    </filter>

    <style>
      /* PIVOT ONLY AT CROSSBAR APEX (190px, 78px) */
      .swing-assembly {
        transform-origin: 190px 78px;
        animation: swingMotion 3.4s cubic-bezier(0.42, 0.02, 0.58, 0.98) infinite alternate;
      }

      @keyframes swingMotion {
        0% {
          transform: rotate(-24deg);
        }
        100% {
          transform: rotate(24deg);
        }
      }

      /* Kites floating in the Dashain breeze */
      .dashain-kite-1 {
        transform-origin: 55px 45px;
        animation: kiteFly1 4.5s ease-in-out infinite alternate;
      }
      .dashain-kite-2 {
        transform-origin: 320px 40px;
        animation: kiteFly2 5.5s ease-in-out infinite alternate;
      }

      @keyframes kiteFly1 {
        0% { transform: translate(0, 0) rotate(-4deg); }
        50% { transform: translate(8px, -6px) rotate(6deg); }
        100% { transform: translate(-4px, -12px) rotate(-8deg); }
      }

      @keyframes kiteFly2 {
        0% { transform: translate(0, 0) rotate(5deg); }
        50% { transform: translate(-10px, -8px) rotate(-6deg); }
        100% { transform: translate(6px, -14px) rotate(8deg); }
      }

      /* Fluttering kite tails */
      .kite-tail-1 {
        animation: tailWiggle 1.8s ease-in-out infinite alternate;
        transform-origin: 55px 65px;
      }
      .kite-tail-2 {
        animation: tailWiggle 2.2s ease-in-out infinite alternate 0.5s;
        transform-origin: 320px 58px;
      }

      @keyframes tailWiggle {
        0% { transform: rotate(-10deg); }
        100% { transform: rotate(14deg); }
      }

      /* Patuka fluttering in wind */
      .patuka-flutter {
        animation: patukaWiggle 1.2s ease-in-out infinite alternate;
        transform-origin: 194px 212px;
      }
      @keyframes patukaWiggle {
        0% { transform: rotate(-6deg); }
        100% { transform: rotate(8deg); }
      }
    </style>
  </defs>

  <!-- ============================================== -->
  <!-- BACKGROUND: DASHAIN KITES (चङ्गा - CHANGA CHAIT) -->
  <!-- ============================================== -->
  <g id="kites-and-birds" opacity="0.95">
    <!-- Birds in distant Dashain sky -->
    <g stroke="#FFD54F" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.75">
      <path d="M 105 32 Q 112 25 119 32 Q 126 25 133 32" />
      <path d="M 125 45 Q 130 40 135 45 Q 140 40 145 45" />
      <path d="M 245 28 Q 251 22 257 28 Q 263 22 269 28" />
    </g>

    <!-- Kite 1 (Left - Red & Gold Diamond Changa) -->
    <g class="dashain-kite-1" filter="url(#softGlow)">
      <path d="M 55 65 Q 40 160 20 280" stroke="rgba(255,255,255,0.22)" stroke-width="0.7" fill="none" stroke-dasharray="3,3" />
      <polygon points="55,25 75,45 55,65 35,45" fill="url(#kite1Grad)" stroke="#FFE082" stroke-width="1.2" />
      <line x1="55" y1="25" x2="55" y2="65" stroke="#FFE082" stroke-width="1" />
      <path d="M 35 45 Q 55 52 75 45" stroke="#FFE082" stroke-width="1" fill="none" />
      <polygon points="53,65 57,65 55,71" fill="#FFD54F" />
      <polygon points="35,43 35,47 29,45" fill="#E53935" />
      <polygon points="75,43 75,47 81,45" fill="#E53935" />

      <!-- Long Ribbon Tail -->
      <g class="kite-tail-1">
        <path d="M 55 70 Q 48 85 58 100 T 52 130" stroke="#FFD54F" stroke-width="1.4" fill="none" />
        <polygon points="52,82 56,86 54,84" fill="#E53935" />
        <polygon points="56,98 60,102 58,100" fill="#43A047" />
        <polygon points="50,116 54,120 52,118" fill="#FB8C00" />
      </g>
    </g>

    <!-- Kite 2 (Right - Green & Cyan Diamond Changa) -->
    <g class="dashain-kite-2" filter="url(#softGlow)">
      <path d="M 320 58 Q 335 150 355 280" stroke="rgba(255,255,255,0.22)" stroke-width="0.7" fill="none" stroke-dasharray="3,3" />
      <polygon points="320,24 336,41 320,58 304,41" fill="url(#kite2Grad)" stroke="#B2EBF2" stroke-width="1.2" />
      <line x1="320" y1="24" x2="320" y2="58" stroke="#B2EBF2" stroke-width="0.9" />
      <path d="M 304 41 Q 320 47 336 41" stroke="#B2EBF2" stroke-width="0.9" fill="none" />
      <polygon points="318,58 322,58 320,64" fill="#B2EBF2" />
      <polygon points="304,39 304,43 299,41" fill="#43A047" />
      <polygon points="336,39 336,43 341,41" fill="#43A047" />

      <g class="kite-tail-2">
        <path d="M 320 63 Q 328 76 318 90 T 324 115" stroke="#80DEEA" stroke-width="1.2" fill="none" />
        <polygon points="323,74 327,78 325,76" fill="#FFEB3B" />
        <polygon points="318,89 322,93 320,91" fill="#E53935" />
      </g>
    </g>
  </g>

  <!-- ============================================== -->
  <!-- STATIC BAMBOO FRAME (४ बाँसका लिङ्गाहरू - FIRMLY ROOTED) -->
  <!-- These NEVER swing - grounded firmly in earth -->
  <!-- ============================================== -->
  <g id="stationary-bamboo-frame" filter="url(#goldGlow)">
    
    <!-- REAR BAMBOO PILLARS -->
    <!-- Rear Left Pillar -->
    <path d="M 183 75 Q 140 160 85 285" stroke="url(#goldBamboo)" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.85" />
    <!-- Rear Right Pillar -->
    <path d="M 197 75 Q 240 160 295 285" stroke="url(#goldBamboo)" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.85" />

    <!-- FRONT BAMBOO PILLARS (A-Frame) -->
    <!-- Front Left Pillar -->
    <path d="M 215 15 Q 195 65 110 285" stroke="url(#goldBamboo)" stroke-width="7" fill="none" stroke-linecap="round" />
    <!-- Front Right Pillar -->
    <path d="M 165 15 Q 185 65 270 285" stroke="url(#goldBamboo)" stroke-width="7" fill="none" stroke-linecap="round" />

    <!-- Bamboo Joints / Nodes (गाँठाहरू) -->
    <g stroke="#FFD54F" stroke-width="2.2" opacity="0.9">
      <!-- Left pillar nodes -->
      <line x1="172" y1="120" x2="182" y2="123" />
      <line x1="154" y1="165" x2="165" y2="169" />
      <line x1="135" y1="215" x2="147" y2="220" />
      <line x1="116" y1="265" x2="129" y2="271" />

      <!-- Right pillar nodes -->
      <line x1="198" y1="123" x2="208" y2="120" />
      <line x1="215" y1="169" x2="226" y2="165" />
      <line x1="233" y1="220" x2="245" y2="215" />
      <line x1="251" y1="271" x2="264" y2="265" />
    </g>

    <!-- Top Sprouting Bamboo Leaves (टुप्पोको बाँसका पातहरू) -->
    <g fill="#FFCA28" stroke="#FF8F00" stroke-width="0.8">
      <path d="M 215 15 Q 235 5 250 8 Q 235 18 215 15" />
      <path d="M 210 22 Q 230 18 245 25 Q 228 30 210 22" />
      <path d="M 205 30 Q 222 30 235 40 Q 218 40 205 30" />

      <path d="M 165 15 Q 145 5 130 8 Q 145 18 165 15" />
      <path d="M 170 22 Q 150 18 135 25 Q 152 30 170 22" />
      <path d="M 175 30 Q 158 30 145 40 Q 162 40 175 30" />
    </g>

    <!-- Apex Crossbar (काठको बलियो तेर्सो लिङ्गो) -->
    <rect x="156" y="73" width="68" height="10" rx="4" fill="url(#goldBamboo)" stroke="#FFD54F" stroke-width="1.5" />
    <!-- Heavy Rope Bindings around Crossbar -->
    <ellipse cx="180" cy="78" rx="7" ry="5.5" fill="#D7CCC8" stroke="#8D6E63" stroke-width="1" />
    <ellipse cx="200" cy="78" rx="7" ry="5.5" fill="#D7CCC8" stroke="#8D6E63" stroke-width="1" />
    <ellipse cx="190" cy="78" rx="9" ry="6.5" fill="#8D6E63" stroke="#5D4037" stroke-width="1" />

    <!-- Grass at Base -->
    <g fill="#43A047" opacity="0.85">
      <path d="M 75 285 Q 85 272 95 285 Q 105 270 115 285 Z" />
      <path d="M 260 285 Q 270 270 280 285 Q 290 272 300 285 Z" />
    </g>
  </g>

  <!-- ============================================== -->
  <!-- SWING ASSEMBLY (ONLY ROPES, SEAT & PERSON SWING) -->
  <!-- Centered at x=190, pivots around apex (190, 78) -->
  <!-- ============================================== -->
  <g class="swing-assembly" filter="url(#goldGlow)">
    
    <!-- Twin Jute Ropes hanging down straight to the seat -->
    <!-- Left Rope -->
    <line x1="183" y1="80" x2="183" y2="216" stroke="url(#ropeGrad)" stroke-width="2.4" stroke-linecap="round" />
    <line x1="183" y1="80" x2="183" y2="216" stroke="#8D6E63" stroke-width="1.5" stroke-dasharray="2,4" opacity="0.65" />

    <!-- Right Rope -->
    <line x1="197" y1="80" x2="197" y2="216" stroke="url(#ropeGrad)" stroke-width="2.4" stroke-linecap="round" />
    <line x1="197" y1="80" x2="197" y2="216" stroke="#8D6E63" stroke-width="1.5" stroke-dasharray="2,4" opacity="0.65" />

    <!-- Wooden Seat (पिर्का) - Centered under the rider -->
    <rect x="173" y="215" width="34" height="5.5" rx="2" fill="#8D6E63" stroke="#FFE082" stroke-width="1" />
    <!-- Rope knots under the seat -->
    <circle cx="183" cy="222" r="2" fill="#D7CCC8" stroke="#8D6E63" stroke-width="0.8" />
    <circle cx="197" cy="222" r="2" fill="#D7CCC8" stroke="#8D6E63" stroke-width="0.8" />

    <!-- ========================================== -->
    <!-- PERSON SITTING PROPERLY ON THE SEAT (दौरा-सुरुवाल, टीका, जमरा, ढाका टोपी) -->
    <!-- Proportionate size: seated firmly on the wooden plank at y=215 -->
    <!-- ========================================== -->
    <g id="seated-rider">
      
      <!-- 1. LEGS & SURUWAL (सुरुवाल) -->
      <!-- Hips/thighs resting directly on the seat at y=215 -->
      <!-- Left leg (Thigh extending forward to knee, calf swinging playfully forward) -->
      <path d="M 188 214 Q 178 215 174 216 Q 169 224 165 233" stroke="#FAF8F5" stroke-width="4.2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Suruwal folds/creases -->
      <path d="M 177 215 Q 174 220 171 226" stroke="#D7CCC8" stroke-width="1" fill="none" opacity="0.8" />
      
      <!-- Right leg (Behind, slightly bent at knee) -->
      <path d="M 191 214 Q 182 216 178 218 Q 174 227 171 234" stroke="#EDE7D9" stroke-width="3.8" fill="none" stroke-linecap="round" opacity="0.9" />

      <!-- Nepali Shoes / Bare Feet (खुट्टा) -->
      <ellipse cx="163" cy="235" rx="3.5" ry="2" fill="#5D4037" transform="rotate(-15 163 235)" />
      <ellipse cx="169" cy="236" rx="3.2" ry="1.8" fill="#4E342E" transform="rotate(-10 169 236)" />

      <!-- 2. DAURA & PATUKA & ISHTAKOT (दौरा, पटुका र इस्टाकोट) -->
      <!-- Pelvis sitting on seat -->
      <path d="M 182 215 L 196 215 L 194 207 L 184 207 Z" fill="#FAF8F5" />

      <!-- Red Patuka (रातो पटुका - Waistband Sash) -->
      <rect x="183" y="206" width="13" height="4.5" rx="1.5" fill="#D32F2F" stroke="#FFD54F" stroke-width="0.6" />
      <!-- Patuka fluttering end hanging on the side -->
      <path class="patuka-flutter" d="M 194 208 Q 198 212 201 217 Q 198 219 195 212" fill="#D32F2F" stroke="#FFD54F" stroke-width="0.5" />

      <!-- Daura Tunic (Chest/Torso leaning slightly back with momentum) -->
      <path d="M 184 206 L 183 189 L 195 189 L 195 206 Z" fill="url(#dauraGrad)" />
      <!-- Daura cross-neck collar (दायाँ र बायाँ तुना बाध्ने गलो) -->
      <path d="M 185 189 L 191 199 L 194 189" stroke="#E0D7C6" stroke-width="0.9" fill="none" />

      <!-- Ishtakot (Nepali Vest / Waistcoat) -->
      <!-- Left side of vest -->
      <path d="M 183 190 L 187 206 L 184 206 Z" fill="url(#ishtakotGrad)" stroke="#FFD54F" stroke-width="0.4" />
      <!-- Right side of vest -->
      <path d="M 195 190 L 192 206 L 195 206 Z" fill="url(#ishtakotGrad)" stroke="#FFD54F" stroke-width="0.4" />
      <!-- Gold buttons on vest -->
      <circle cx="189.5" cy="193" r="0.7" fill="#FFD700" />
      <circle cx="189.5" cy="197" r="0.7" fill="#FFD700" />
      <circle cx="189.5" cy="201" r="0.7" fill="#FFD700" />

      <!-- 3. ARMS & HANDS FIRMLY GRIPPING ROPES -->
      <!-- Rear Arm (holding right rope at x=197, y=193) -->
      <path d="M 194 190 Q 196 191 197 193" stroke="#FAF8F5" stroke-width="2.8" fill="none" stroke-linecap="round" />
      <!-- Hand gripping right rope -->
      <ellipse cx="197" cy="193" rx="2.2" ry="1.6" fill="#F5CBA7" stroke="#E0A96D" stroke-width="0.5" />

      <!-- Front Arm (reaching and holding left rope at x=183, y=193) -->
      <path d="M 185 190 Q 183 191 183 193" stroke="#FAF8F5" stroke-width="3" fill="none" stroke-linecap="round" />
      <!-- Hand gripping left rope -->
      <ellipse cx="183" cy="193" rx="2.2" ry="1.6" fill="#F5CBA7" stroke="#E0A96D" stroke-width="0.5" />

      <!-- 4. NECK & HEAD -->
      <rect x="187.5" y="185.5" width="3.5" height="4" fill="#F5CBA7" />
      
      <!-- Head / Face (warm skin tone) -->
      <circle cx="189" cy="181" r="5.2" fill="#F5CBA7" />
      <!-- Facial features: smiling eye & joyful mouth -->
      <path d="M 186.5 180.5 Q 185.5 180 185 180.8" stroke="#424242" stroke-width="0.6" fill="none" />
      <!-- Happy smile -->
      <path d="M 185.5 183 Q 187 184.8 188.5 183.5" stroke="#B71C1C" stroke-width="0.7" fill="none" />

      <!-- 5. DASHAIN TIKA (रातो अक्षता टीका) ON FOREHEAD -->
      <!-- Round bright vermilion red Tika -->
      <circle cx="185.8" cy="179.5" r="1.5" fill="#D32F2F" stroke="#B71C1C" stroke-width="0.3" />
      <!-- White rice grains (अक्षता) in the Tika -->
      <circle cx="185.5" cy="179.2" r="0.45" fill="#FFFFFF" />
      <circle cx="186.1" cy="179.4" r="0.4" fill="#FFFFFF" />
      <circle cx="185.7" cy="180" r="0.4" fill="#FFFFFF" />

      <!-- 6. DHAKA TOPI (ढाका टोपी) -->
      <!-- Traditional Palpali peaked Dhaka Topi tilted proudly on the head -->
      <g id="dhaka-topi">
        <!-- Topi base polygon -->
        <polygon points="184.5,177.5 194.5,177 195,170 188.5,168 183.5,173" fill="#C62828" stroke="#FFD54F" stroke-width="0.5" />
        
        <!-- Dhaka geometric patterns (Chevron / diamonds in black, white, gold) -->
        <!-- Diamond 1 -->
        <polygon points="187,175 189,172.5 191,175 189,177" fill="#212121" />
        <polygon points="188,175 189,173.8 190,175 189,176.2" fill="#FFF8E7" />
        
        <!-- Diamond 2 -->
        <polygon points="191,174.5 193,172 195,174 193,176.5" fill="#FFD700" />
        
        <!-- Top peak fold of Topi -->
        <line x1="183.5" y1="173" x2="188.5" y2="168" stroke="#FFE082" stroke-width="0.6" />
        <line x1="188.5" y1="168" x2="195" y2="170" stroke="#FFE082" stroke-width="0.6" />
      </g>

      <!-- 7. JAMARA (पहेँलो जमरा) TUCKED IN DHAKA TOPI / BEHIND EAR -->
      <!-- Golden yellow barley sprouts waving backwards in the wind -->
      <g id="jamara-shoots">
        <!-- Sprout 1 -->
        <path d="M 193 175 Q 197 172 201 170" stroke="#FFEB3B" stroke-width="0.9" fill="none" stroke-linecap="round" />
        <!-- Sprout 2 -->
        <path d="M 193 176 Q 198 174 203 174" stroke="#FDD835" stroke-width="0.8" fill="none" stroke-linecap="round" />
        <!-- Sprout 3 (Fresh green-yellow shoot) -->
        <path d="M 193 176.5 Q 197 177 201 178" stroke="#C0CA33" stroke-width="0.75" fill="none" stroke-linecap="round" />
      </g>

    </g>
  </g>
</svg>
